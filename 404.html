<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>404 — Solace</title>
    <link rel="icon" type="image/png" href="assets/branding/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400..700&family=VT323&display=swap"
        rel="stylesheet">
    <meta name="description" content="Solace is a fan-made, unofficial server replacement for Minecraft Earth.">
    <meta name="robots" content="noindex, follow">
    <meta name="theme-color" content="#1C519E">
    <link rel="stylesheet" href="assets/css/main.css">
    <link rel="stylesheet" href="assets/css/404.css">
</head>

<body>
    <div id="page-load-bar"></div>
    <div class="wrap nf-wrap">
        <div class="nf-heading">
            <h1>Page Not Found</h1>
            <p class="subtitle">This page doesn't exist, or it may have moved.</p>
        </div>

        <div class="nf-hole" id="nf-hole">
            <div class="nf-hole-bg"></div>
            <div class="nf-hole-geode">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-1">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-2">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-3">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-4">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-5">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-6">
                <img src="assets/404/geode/solacium_bud.png" alt="" class="nf-bud nf-bud-7">
            </div>
            <div class="nf-hole-glow"></div>
            <div class="nf-hole-cover"></div>
        </div>

        <div class="nf-actions">
            <a href="/" class="btn btn-secondary">
                <i class="solace-scroll"></i>
                <span>Back to Home</span>
            </a>
        </div>

        <footer>
            <span>© 2026 Earth Restored</span>
        </footer>
    </div>

    <img id="lantern-cursor" src="assets/404/lantern.png" alt="">

    <script src="assets/js/main.js"></script>
    <script src="assets/js/404.js"></script>
</body>

</html>
